<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学習管理アプリ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@600..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/tasks.css" />
    <link rel="stylesheet" href="css/books.css" />
    <link rel="stylesheet" href="css/modal.css" />
    <script src="js/api.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/tasks.js" defer></script>
  </head>
  <body>
    <header class="page-header wrapper">
      <h1><a href="index.html">学習管理記録</a></h1>
    </header>

    <div class="container">
      <nav>
        <!-- divやasideよりnavが適切 -->
        <ul>
          <li><a href="#page-dashboard">ダッシュボード</a></li>
          <li><a href="#page-tasks">タスク一覧</a></li>
          <li><a href="#page-books">書籍マスタ</a></li>
        </ul>
      </nav>

      <main>
        <!-- divやasideよりmainが適切 -->
        <section id="page-dashboard">ダッシュボード</section>
        <section id="page-tasks">
          タスク一覧
          <button id="btn-add-group">+ 親タスク追加</button>
          <div class="kanban">
            <div class="kanban-column">
              <div class="kanban-header">
                <span>未着手</span>
              </div>
              <div class="kanban-cards" data-status="未着手"></div>
            </div>
            <div class="kanban-column">
              <div class="kanban-header">
                <span>進行中</span>
              </div>
              <div class="kanban-cards" data-status="進行中"></div>
            </div>
            <div class="kanban-column">
              <div class="kanban-header">
                <span>完了</span>
              </div>
              <div class="kanban-cards" data-status="完了"></div>
            </div>
          </div>
        </section>
        <section id="page-books">書籍マスタ</section>
      </main>
    </div>

    <div id="group-modal" class="modal hidden">
      <div class="modal-content">
        <label for="group-title">タイトル</label>
        <input type="text" id="group-title" />
        <label for="group-memo">メモ</label>
        <textarea id="group-memo"></textarea>
        <div class="modal-actions">
          <button type="button" id="btn-group-save" class="btn btn-primary">
            保存
          </button>
          <button type="button" id="btn-group-delete" class="btn btn-danger">
            削除
          </button>
          <button type="button" id="btn-group-close" class="btn btn-secondary">
            閉じる
          </button>
        </div>
      </div>
    </div>
    <div id="task-modal" class="modal hidden">
      <div class="modal-content">
        <label for="task-title">タイトル</label>
        <input type="text" id="task-title" />
        <label for="task-type">種別</label>
        <select id="task-type">
          <option value="本">本</option>
          <option value="動画">動画</option>
          <option value="記事">記事</option>
          <option value="手を動かす練習">手を動かす練習</option>
        </select>
        <label for="task-status">ステータス</label>
        <select id="task-status">
          <option value="未着手">未着手</option>
          <option value="進行中">進行中</option>
          <option value="完了">完了</option>
        </select>

        <label for="task-planned-date">予定日</label>
        <input type="date" id="task-planned-date" />

        <label for="task-study-time">学習時間</label>
        <input type="number" id="task-study-time" />

        <label for="task-memo">メモ</label>
        <textarea id="task-memo"></textarea>
        <div class="task-actions">
          <button type="button" id="btn-task-save" class="btn btn-primary">
            保存
          </button>
          <button type="button" id="btn-task-delete" class="btn btn-danger">
            削除
          </button>
          <button type="button" id="btn-task-close" class="btn btn-secondary">
            閉じる
          </button>
        </div>
      </div>
    </div>

    <footer>
      <p>ここはフッターです</p>
    </footer>
  </body>
</html>
